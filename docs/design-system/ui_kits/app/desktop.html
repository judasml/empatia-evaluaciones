<!-- @dsCard group="empat.IA 360 · App" viewport="900x820" name="Encuesta 270°/360° · Desktop" subtitle="Mismo flujo, tarjeta centrada ~640px, más respirado" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>empat.IA 360 — Encuesta (desktop)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font-sans);
    color: var(--text-strong);
    background: var(--bg-canvas);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 24px;
  }
  /* Desktop card shell — same components, single column, just more air. */
  .deskcard {
    width: min(640px, 100%);
    height: min(780px, calc(100vh - 80px));
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--surface-muted); border-radius: 999px; border: 3px solid var(--surface); }
  .fade { animation: fade var(--dur-base) var(--ease-out); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    window.__EMPAT_SHELL = 'desktop';
    (async function boot() {
      const opt = { presets: [['react', { runtime: 'classic' }]] };
      const load = async (url) => Babel.transform(await (await fetch(url)).text(), opt).code;
      const ds = await load('../../ds-preview.js');
      const app = await load('./app.jsx');
      (0, eval)(ds);
      (0, eval)(app);
    })().catch((e) => {
      document.getElementById('root').innerHTML = '<pre style="padding:16px;color:#b00;font:12px monospace;white-space:pre-wrap">' + (e && e.stack || e) + '</pre>';
    });
  </script>
</body>
</html>

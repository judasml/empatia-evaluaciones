<!-- @startingPoint section="empat.IA 360 · App" subtitle="Encuesta de evaluación 270°/360° — flujo completo" viewport="440x820" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>empat.IA 360 — Encuesta de evaluación</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    color: var(--text-strong);
    background:
      radial-gradient(120% 90% at 50% -10%, oklch(0.96 0.012 74) 0%, var(--bg-canvas) 60%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 28px 16px;
  }
  /* Device */
  .device {
    width: 390px; height: 800px; position: relative;
    background: var(--bg-page);
    border-radius: 44px;
    box-shadow: 0 40px 80px -30px oklch(0.4 0.03 70 / 0.5), 0 0 0 10px oklch(0.22 0.01 70), 0 0 0 11px oklch(0.32 0.01 70);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px 0 28px; font-size: 14px; font-weight: var(--fw-semibold); color: var(--text-strong);
    background: var(--surface);
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width: 0; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 128px; height: 5px; border-radius: 999px; background: oklch(0.7 0.01 70 / 0.5); }
  @media (max-width: 460px) {
    body { padding: 0; }
    .device { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
  }
  .fade { animation: fade var(--dur-base) var(--ease-out); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    (async function boot() {
      const opt = { presets: [['react', { runtime: 'classic' }]] };
      const load = async (url) => Babel.transform(await (await fetch(url)).text(), opt).code;
      const ds = await load('../../ds-preview.js');
      const app = await load('./app.jsx');
      (0, eval)(ds);
      (0, eval)(app);
    })().catch((e) => {
      document.getElementById('root').innerHTML = '<pre style="padding:16px;color:#b00;font:12px monospace;white-space:pre-wrap">' + (e && e.stack || e) + '</pre>';
    });
  </script>
</body>
</html>

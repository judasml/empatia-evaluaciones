<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-strong);padding:28px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;max-width:640px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 4px}
</style></head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/plain" id="demo">
  const { Input, Textarea, Select, Checkbox, Radio, Switch } = window.Empat;
  const Search = (p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>;
  function Demo(){
    return (
      <div className="grid">
        <div className="stack">
          <Input label="Nombre del evaluado" placeholder="Busca a un compañero…" leadingIcon={<Search/>} />
          <Input label="Email de contacto" type="email" error="Introduce un email válido." defaultValue="ana@" />
          <Select label="Relación laboral" placeholder="Selecciona…" options={[{value:'j',label:'Tu jefa'},{value:'p',label:'Tu par'},{value:'r',label:'Te reporta'}]} />
        </div>
        <div className="stack">
          <Textarea label="Comentario abierto" rows={3} maxLength={600} showCount helper="Sé específico y constructivo." />
          <div className="stack" style={{gap:12}}>
            <Checkbox label="Evaluación anónima" description="Tu nombre no se mostrará." defaultChecked />
            <div style={{display:'flex',gap:20}}>
              <Radio name="f" label="Trimestral" defaultChecked />
              <Radio name="f" label="Semestral" />
            </div>
            <Switch label="Recordatorios por email" defaultChecked />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
(async()=>{const opt={presets:[['react',{runtime:'classic'}]]};
const load=async u=>Babel.transform(await(await fetch(u)).text(),opt).code;
(0,eval)(await load('../../ds-preview.js'));
(0,eval)(Babel.transform(document.getElementById('demo').textContent,opt).code);})();
</script>
</body></html>

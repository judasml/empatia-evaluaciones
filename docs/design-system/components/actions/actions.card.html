<!-- @dsCard group="Components" viewport="700x300" name="Botones" subtitle="Button (primary/secondary/ghost/danger) + IconButton" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-strong);padding:28px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 10px}
</style></head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/plain" id="demo">
  const { Button, IconButton } = window.Empat;
  const Plus = (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}><path d="M12 5v14M5 12h14"/></svg>;
  const Bell = (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>;
  function Demo(){
    return (
      <div>
        <p className="lbl">Variantes</p>
        <div className="row">
          <Button variant="primary">Enviar evaluación</Button>
          <Button variant="secondary">Guardar borrador</Button>
          <Button variant="ghost">Cancelar</Button>
          <Button variant="danger">Eliminar</Button>
        </div>
        <p className="lbl">Tamaños · con icono · deshabilitado</p>
        <div className="row">
          <Button size="sm">Pequeño</Button>
          <Button size="md" leadingIcon={<Plus/>}>Añadir evaluador</Button>
          <Button size="lg">Grande</Button>
          <Button disabled>Deshabilitado</Button>
        </div>
        <p className="lbl">IconButton</p>
        <div className="row">
          <IconButton aria-label="Notificaciones"><Bell/></IconButton>
          <IconButton variant="secondary" aria-label="Añadir"><Plus/></IconButton>
          <IconButton variant="primary" aria-label="Añadir"><Plus/></IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
(async()=>{const opt={presets:[['react',{runtime:'classic'}]]};
const load=async u=>Babel.transform(await(await fetch(u)).text(),opt).code;
(0,eval)(await load('../../ds-preview.js'));
(0,eval)(Babel.transform(document.getElementById('demo').textContent,opt).code);})();
</script>
</body></html>

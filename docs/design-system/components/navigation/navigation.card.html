<!-- @dsCard group="Components" viewport="700x420" name="Navegación" subtitle="AppHeader (logo slot white-label), Tabs, BottomNav" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-strong);padding:28px}
  .frame{max-width:420px;border:1px solid var(--border-subtle);border-radius:var(--radius-xl);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-card);margin-bottom:20px}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 10px}
</style></head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/plain" id="demo">
  const { AppHeader, Tabs, BottomNav, IconButton } = window.Empat;
  const Help=(p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .8-1 1.7"/><path d="M12 17h.01"/></svg>;
  const Home=(p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>;
  const Users=(p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6M21 20a5.5 5.5 0 0 0-4-5.3"/></svg>;
  const Chart=(p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M4 20V10M12 20V4M20 20v-7"/></svg>;
  const Logo=()=> <div style={{display:'inline-flex',alignItems:'center',gap:8}}><div style={{width:26,height:26,borderRadius:8,background:'var(--text-strong)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}><div style={{width:10,height:10,borderRadius:'50%',border:'2px solid #fff'}}/></div><span style={{fontWeight:'var(--fw-bold)',letterSpacing:'-0.02em'}}>Northwind</span></div>;
  function Demo(){
    const [tab,setTab]=React.useState('pend');
    const [nav,setNav]=React.useState('equipo');
    return (
      <div style={{maxWidth:420}}>
        <p className="lbl">AppHeader · slot de logo (white-label) + variante compacta</p>
        <div className="frame">
          <div style={{padding:'0 20px',height:60,display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid var(--border-subtle)'}}>
            <Logo/>
            <IconButton aria-label="Ayuda"><Help/></IconButton>
          </div>
          <AppHeader compact onBack={()=>{}} person="Lucía Fernández" relation="Tu jefa" />
        </div>
        <p className="lbl">Tabs</p>
        <div className="frame" style={{padding:'0 12px'}}>
          <Tabs value={tab} onChange={setTab} tabs={[{value:'pend',label:'Pendientes',count:4},{value:'done',label:'Enviadas',count:8},{value:'all',label:'Todas'}]} />
        </div>
        <p className="lbl">BottomNav</p>
        <div className="frame">
          <BottomNav value={nav} onChange={setNav} items={[{value:'inicio',label:'Inicio',icon:<Home/>},{value:'equipo',label:'Equipo',icon:<Users/>},{value:'reportes',label:'Reportes',icon:<Chart/>}]} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
(async()=>{const opt={presets:[['react',{runtime:'classic'}]]};
const load=async u=>Babel.transform(await(await fetch(u)).text(),opt).code;
(0,eval)(await load('../../ds-preview.js'));
(0,eval)(Babel.transform(document.getElementById('demo').textContent,opt).code);})();
</script>
</body></html>

<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-strong);padding:0;min-height:360px}
  .stage{position:relative;min-height:360px}
  .lbl{position:absolute;top:16px;left:20px;z-index:1;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
  .tip{position:absolute;top:16px;right:24px;z-index:1}
</style></head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/plain" id="demo">
  const { Dialog, Tooltip, Button, IconButton } = window.Empat;
  const Info=(p)=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>;
  function Demo(){
    return (
      <div className="stage">
        <span className="lbl">Dialog (bottom) + Tooltip</span>
        <div className="tip"><Tooltip label="Tus respuestas son anónimas" side="left"><IconButton variant="secondary" aria-label="Info"><Info/></IconButton></Tooltip></div>
        <Dialog open onClose={()=>{}} dock="bottom"
          title="¿Terminar más tarde?"
          description="Puedes volver con el mismo enlace y retomar justo donde lo dejaste. Tu progreso queda guardado."
          footer={<><Button variant="ghost">Seguir ahora</Button><Button variant="secondary">Terminar</Button></>} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
(async()=>{const opt={presets:[['react',{runtime:'classic'}]]};
const load=async u=>Babel.transform(await(await fetch(u)).text(),opt).code;
(0,eval)(await load('../../ds-preview.js'));
(0,eval)(Babel.transform(document.getElementById('demo').textContent,opt).code);})();
</script>
</body></html>

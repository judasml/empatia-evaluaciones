<!-- @dsCard group="Components" viewport="700x280" name="KimOrb" subtitle="El orbe KIM — respira en reposo, brilla al hover, pulsa al escribir" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-strong);padding:28px}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 12px}
</style></head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/plain" id="demo">
  const { KimOrb } = window.Empat;
  function Demo(){
    return (
      <div style={{display:'flex',gap:48,alignItems:'flex-start'}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
          <KimOrb />
          <span className="lbl" style={{margin:0}}>Reposo · 80px</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
          <KimOrb active />
          <span className="lbl" style={{margin:0}}>Escribiendo</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,paddingTop:18}}>
          <KimOrb size={44} />
          <span className="lbl" style={{margin:0}}>Mini · 44px</span>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
(async()=>{const opt={presets:[['react',{runtime:'classic'}]]};
const load=async u=>Babel.transform(await(await fetch(u)).text(),opt).code;
(0,eval)(await load('../../ds-preview.js'));
(0,eval)(Babel.transform(document.getElementById('demo').textContent,opt).code);})();
</script>
</body></html>

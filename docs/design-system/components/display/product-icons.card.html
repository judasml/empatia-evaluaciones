<!-- @dsCard group="Components" viewport="700x330" name="ProductIcon" subtitle="Íconos multicolor de las acciones principales — paleta fija del producto" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-strong);padding:28px}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 12px}
</style></head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/plain" id="demo">
  const { ProductIcon } = window.Empat;
  const NAMES = [
    ['crearEvaluacion','Crear evaluación'],
    ['invitar','Invitar evaluadores'],
    ['cobertura','Cobertura'],
    ['resultados','Resultados'],
    ['importar','Importar historial'],
    ['kim','KIM'],
  ];
  function Demo(){
    return (
      <div>
        <p className="lbl">Sobre teja (tarjetas de acción)</p>
        <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:22}}>
          {NAMES.map(([n,label])=>(
            <div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,width:96}}>
              <ProductIcon name={n} size={38} tile />
              <span style={{fontSize:'var(--fs-caption)',fontWeight:'var(--fw-medium)',color:'var(--text-muted)',textAlign:'center'}}>{label}</span>
            </div>
          ))}
        </div>
        <p className="lbl">Glifo suelto (cabeceras)</p>
        <div style={{display:'flex',gap:18,alignItems:'center'}}>
          {NAMES.map(([n])=> <ProductIcon key={n} name={n} size={26} />)}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
(async()=>{const opt={presets:[['react',{runtime:'classic'}]]};
const load=async u=>Babel.transform(await(await fetch(u)).text(),opt).code;
(0,eval)(await load('../../ds-preview.js'));
(0,eval)(Babel.transform(document.getElementById('demo').textContent,opt).code);})();
</script>
</body></html>

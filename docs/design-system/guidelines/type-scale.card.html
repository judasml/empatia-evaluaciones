<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:24px;color:var(--text-strong)}
.line{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--border-subtle)}
.t{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);flex-shrink:0;width:150px}</style></head>
<body>
<div class="line"><span class="t">display · 38 / 800</span><span style="font-size:var(--fs-display);font-weight:800;letter-spacing:-0.02em">Ayuda a tu equipo</span></div>
<div class="line"><span class="t">h1 · 30 / 700</span><span style="font-size:var(--fs-h1);font-weight:700;letter-spacing:-0.02em">Evaluación enviada</span></div>
<div class="line"><span class="t">h2 · 24 / 600</span><span style="font-size:var(--fs-h2);font-weight:600;letter-spacing:-0.01em">Comparte información clara</span></div>
<div class="line"><span class="t">h3 · 20 / 600</span><span style="font-size:var(--fs-h3);font-weight:600">Ciclo Q2 2026</span></div>
<div class="line"><span class="t">body · 16 / 400</span><span style="font-size:var(--fs-body)">Tus respuestas son completamente anónimas.</span></div>
<div class="line"><span class="t">caption · 13 / 400</span><span style="font-size:var(--fs-caption);color:var(--text-muted)">Unos 5 minutos por persona</span></div>
</body></html>

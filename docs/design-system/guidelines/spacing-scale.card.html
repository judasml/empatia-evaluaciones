<!-- @dsCard group="Spacing" viewport="700x180" name="Escala de espaciado" subtitle="Base 4px, generosa por defecto" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:24px;color:var(--text-strong)}
.row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.b{background:var(--brand-soft);border:1px solid var(--brand-border);border-radius:4px}
.c{display:flex;flex-direction:column;align-items:center;gap:6px}
.t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head>
<body><div class="row">
<div class="c"><div class="b" style="width:var(--space-1);height:var(--space-1)"></div><div class="t">1·4</div></div>
<div class="c"><div class="b" style="width:var(--space-2);height:var(--space-2)"></div><div class="t">2·8</div></div>
<div class="c"><div class="b" style="width:var(--space-3);height:var(--space-3)"></div><div class="t">3·12</div></div>
<div class="c"><div class="b" style="width:var(--space-4);height:var(--space-4)"></div><div class="t">4·16</div></div>
<div class="c"><div class="b" style="width:var(--space-5);height:var(--space-5)"></div><div class="t">5·20</div></div>
<div class="c"><div class="b" style="width:var(--space-6);height:var(--space-6)"></div><div class="t">6·24</div></div>
<div class="c"><div class="b" style="width:var(--space-7);height:var(--space-7)"></div><div class="t">7·32</div></div>
<div class="c"><div class="b" style="width:var(--space-8);height:var(--space-8)"></div><div class="t">8·40</div></div>
<div class="c"><div class="b" style="width:var(--space-9);height:var(--space-9)"></div><div class="t">9·48</div></div>
<div class="c"><div class="b" style="width:var(--space-10);height:var(--space-10)"></div><div class="t">10·64</div></div>
</div></body></html>

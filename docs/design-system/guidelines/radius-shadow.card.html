<!-- @dsCard group="Spacing" viewport="700x190" name="Radios y sombras" subtitle="Esquinas suaves, sombras casi imperceptibles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:24px;color:var(--text-strong)}
.hd{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.box{width:96px;height:56px;background:var(--surface);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;justify-content:center;padding:6px}
.t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head>
<body>
<p class="hd">Radios</p>
<div class="row">
<div class="box" style="border-radius:var(--radius-sm)"><span class="t">sm·8</span></div>
<div class="box" style="border-radius:var(--radius-md)"><span class="t">md·12</span></div>
<div class="box" style="border-radius:var(--radius-lg)"><span class="t">lg·16</span></div>
<div class="box" style="border-radius:var(--radius-xl)"><span class="t">xl·20</span></div>
<div class="box" style="border-radius:var(--radius-2xl)"><span class="t">2xl·28</span></div>
</div>
<p class="hd">Sombras</p>
<div class="row" style="margin-bottom:0">
<div class="box" style="border-radius:var(--radius-md);border-color:transparent;box-shadow:var(--shadow-xs)"><span class="t">xs</span></div>
<div class="box" style="border-radius:var(--radius-md);border-color:transparent;box-shadow:var(--shadow-sm)"><span class="t">sm</span></div>
<div class="box" style="border-radius:var(--radius-md);border-color:transparent;box-shadow:var(--shadow-card)"><span class="t">card</span></div>
<div class="box" style="border-radius:var(--radius-md);border-color:transparent;box-shadow:var(--shadow-md)"><span class="t">md</span></div>
<div class="box" style="border-radius:var(--radius-md);border-color:transparent;box-shadow:var(--shadow-lg)"><span class="t">lg</span></div>
</div>
</body></html>

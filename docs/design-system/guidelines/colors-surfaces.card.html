<!-- @dsCard group="Colors" viewport="700x180" name="Superficies neutras" subtitle="Fondos cálidos, de página a elevado" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:24px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.sw{width:150px}
.chip{height:72px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
.n{font-size:13px;font-weight:600;color:var(--text-strong);margin:8px 0 1px}
.t{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--bg-page)"></div><div class="n">Página</div><div class="t">--bg-page</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-canvas)"></div><div class="n">Lienzo</div><div class="t">--bg-canvas</div></div>
<div class="sw"><div class="chip" style="background:var(--surface);box-shadow:var(--shadow-card)"></div><div class="n">Superficie</div><div class="t">--surface</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-subtle)"></div><div class="n">Sutil</div><div class="t">--surface-subtle</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-muted)"></div><div class="n">Apagada</div><div class="t">--surface-muted</div></div>
</div></body></html>
